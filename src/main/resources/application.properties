# ==================== SERVER CONFIGURATION ====================
server.port=8082
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ==================== DATABASE CONFIGURATION ====================
spring.datasource.url=jdbc:postgresql://localhost:5433/fashion_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ==================== JPA/HIBERNATE CONFIGURATION ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ==================== LOGGING CONFIGURATION ====================
logging.level.root=INFO
logging.level.com.meryem.fashionstore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ==================== API DOCUMENTATION (SWAGGER/OPENAPI) ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true


# ==================== APPLICATION INFO ====================
spring.application.name=fashion-store
spring.application.version=0.0.1-SNAPSHOT
# ==================== JWT ====================
jwt.secret=dGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9yRmFzaGlvblN0b3JlUHJvamVjdDEyMzQ1Ng==
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ==================== MONGODB ====================
spring.data.mongodb.uri=mongodb://localhost:27017/fashionstore_logs

# ==================== REDIS ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.elasticsearch.uris=http://localhost:9200

spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100